<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            .video-container {
                position: relative;
                /* Proporción 16:9 */
                padding-bottom: 56.25%;
                height: 0;
                overflow: hidden;
                max-width: 100%;
                margin: 1rem auto;
                border: none;
            }

            .video-container iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }
        </style>
        <title>Ejercicio audio y video</title>
    </head>
    <body>
        <header>
            <h1>Ejercicio de audio y video</h1>
        </header>
        <nav></nav>
        <main>
            <article>
                <h2>Ejercicio de video</h2>
                <p>Trailer de la expansión de <strong>Elden Ring</strong></p>
                <div class="video-container"><iframe width="600" src="https://www.youtube.com/embed/qLZenOn7WUo" title="ELDEN RING Shadow of the Erdtree | Official Gameplay Reveal Trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>

                <h2>Ejercicio de audio</h2>
                <audio src="assets/audio/sample-6s.mp3" controls></audio>
                <p>Audio descargado de <a href="https://samplelib.com/es/sample-mp3.html" target="_blank"> samplelib </a>.</p>
            </article>
        </main>
        <footer></footer>
    </body>
</html>
